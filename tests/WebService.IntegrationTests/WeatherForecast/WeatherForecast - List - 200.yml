info:
  name: WeatherForecast - List - 200
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/weatherforecast"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Status code is 200 OK', function(){
          expect(res.getStatus()).to.equal(200);
        });

        test("Response returns right data", function(){
          const body = res.getBody();
          expect(body).to.be.an("array");
          expect(body.length).to.equal(5);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

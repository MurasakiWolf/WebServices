info:
  name: Events - Create- 200
  type: http
  seq: 4

http:
  method: POST
  url: "{{url}}/events"
  body:
    type: json
    data: |-
      {
        "id": "{{$guid}}",
        "title": "{{$randomCatchPhrase}}",
        "date": "{{$randomDateFuture}}",
        "description": "{{$randomLoremParagraph}}",
        "category": "music",
        "isCancelled": false,
        "city": "{{$randomCity}}",
        "venue": "{{$randomStreetName}}",
        "latitude": "19.6925",
        "longitude": "-98.8438"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Status code is 404 Not Found', function(){
          expect(res.getStatus()).to.equal(404);
        });

        test("Response returns right data", function(){
          const body = res.getBody();
          expect(body).to.equal("The event was not found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
